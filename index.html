<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>sistema academico</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header class="barra de navegaçao">
        <div  class="logo" >sistema academico</div>
    </header>
    <main class="geralzao">
        <section class="bloco-do-formulario">
            <div>
                <h2 class="tituloforms">acesso <br>administrativo</h2>
                <form class="formulario">
                    <div class="grupo formulario">
                        <label for="login">login <br>(nome e sobre nome)</label>
                        <input type="text" id="login" placeholder=" seu nome e sobrenome" required>
                    </div>
                    <div class="grupo formulario">
                        <label for="senha">senha</label>
                        <input type="password" id="senha" placeholder="sua senha" required>
                    </div>
                    <a href="#"> esqueceu sua senha?</a>
                    <button class="logar"> entrar</button>
                </form>
                <p>entar com</p>
                <button class="botao-do-gov"> <img src="img/govbr-colorido-b.png" alt=""></button>
            </div>

        </section>
        <section class="bloco-dos-botoes">
            <div>
                <h2> acesso estudante / responsavel</h2>
                <button class="estudante">área do estuante</button>
                <h3>acompanhe o desenvolvimento do sistema academico</h3>
                <button class="requisitos"> planilha com requisitos</button>
            </div>
        </section>
    </main>
    <footer>&copy; sistema cademico</footer>
   
</body>
</html>
